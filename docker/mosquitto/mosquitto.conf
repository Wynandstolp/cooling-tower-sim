# Mosquitto configuration for cooling tower simulator (development)
# WARNING: anonymous access is enabled — not suitable for production.

# MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser clients and Node-RED)
listener 9001
protocol websockets

# Allow unauthenticated connections
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Keep retained messages across restarts (preserves last fault state)
retained_persistence true
