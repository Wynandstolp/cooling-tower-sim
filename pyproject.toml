[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cooling-tower-sim"
version = "0.1.0"
description = "Physics-based cooling tower simulator for industrial data engineering portfolio"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "asyncua>=1.1",
    "paho-mqtt>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulator*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running TimescaleDB container"]
